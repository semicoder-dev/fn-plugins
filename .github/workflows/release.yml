name: Release Fn applications
on:
  push:
    tags: ["apps-v*", "translate-v*", "notes-v*", "kanban-v*", "models-dev-v*"]
  workflow_dispatch:
    inputs:
      version:
        required: true
        default: "0.3.0"
      application:
        type: choice
        options: [all, translate, notes, kanban, models-dev]
        default: all
permissions:
  contents: read
concurrency:
  group: fn-applications-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.4"
      - run: bun scripts/check-release-dependencies.ts
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check && bun run test && bun run pack
      - run: bun scripts/verify-independent.ts
      - name: Verify application release archives
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_APPLICATION: ${{ inputs.application }}
        run: |
          version="${RELEASE_VERSION:-${GITHUB_REF_NAME##*-v}}"
          application="${RELEASE_APPLICATION:-${GITHUB_REF_NAME%-v*}}"
          if [ "$application" = "apps" ]; then application=all; fi
          bun scripts/release.ts "$version" "$application"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fn-applications
          path: artifacts/release/
          if-no-files-found: error
          compression-level: 0
  publish:
    needs: build
    if: github.event_name == 'push' && github.repository == 'semicoder-dev/fn-plugins'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.4"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: fn-applications
          path: release-bundle
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - run: bun scripts/publish.ts release-bundle published-site
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: published-site
      - name: Deploy application catalog
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
