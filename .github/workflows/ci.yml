name: Validate plugin market
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: applications-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - run: bun run test
      - run: bun run pack
      - run: bun scripts/verify-independent.ts
